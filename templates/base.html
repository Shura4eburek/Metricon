<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Metricon{% endblock %} — Bot Metrics</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body { background-color: #0f1117; }
    .navbar-brand { font-weight: 700; letter-spacing: .05em; }
    .card { border-color: #2a2d3a; background-color: #161b27; }
    .stat-tile { text-align: center; padding: 1rem; }
    .stat-tile .value { font-size: 2rem; font-weight: 700; }
    .stat-tile .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: #888; }
    .badge-online { background-color: #00c851; }
    .badge-offline { background-color: #ff4444; }
    .chart-container { position: relative; height: 220px; }
    .traceback-pre { font-size: .75rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .key-masked { font-family: monospace; letter-spacing: .1em; }
    .sparkline-container { height: 60px; }
    .cpu-bar .progress-bar { transition: width .4s ease; }
    a { color: #7eb8ff; }
    a:hover { color: #acd4ff; }
  </style>

  <script src="/static/js/i18n.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#161b27; border-bottom:1px solid #2a2d3a;">
  <div class="container-fluid">
    <a class="navbar-brand text-info" href="/dashboard/">
      <i class="bi bi-graph-up-arrow me-2"></i>Metricon
    </a>
    <div class="navbar-nav ms-auto d-flex align-items-center gap-2">
      <a class="nav-link {% block nav_overview %}{% endblock %}" href="/dashboard/">
        <i class="bi bi-grid-1x2 me-1"></i><span data-i18n="nav.overview">Overview</span>
      </a>
      <a class="nav-link {% block nav_apikeys %}{% endblock %}" href="/dashboard/api-keys/">
        <i class="bi bi-key me-1"></i><span data-i18n="nav.api_keys">API Keys</span>
      </a>
      <div class="d-flex gap-1 ms-3">
        <button class="lang-btn btn btn-sm btn-outline-secondary px-2 py-0" data-lang="en" onclick="I18N.applyLang('en')" title="English">🇺🇸</button>
        <button class="lang-btn btn btn-sm btn-outline-secondary px-2 py-0" data-lang="ru" onclick="I18N.applyLang('ru')" title="Русский">🇷🇺</button>
        <button class="lang-btn btn btn-sm btn-outline-secondary px-2 py-0" data-lang="ua" onclick="I18N.applyLang('ua')" title="Українська">🇺🇦</button>
      </div>
    </div>
  </div>
</nav>

<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script>I18N.applyLang(I18N.currentLang());</script>
{% block extra_js %}{% endblock %}
</body>
</html>
